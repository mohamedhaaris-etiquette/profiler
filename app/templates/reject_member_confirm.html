{% extends 'dashboard_base.html' %}
{% block title %}Reject {{ org.name }}{% endblock %}
{% block dash_content %}
<div class="card border-0 shadow-sm" style="max-width:680px;margin:auto;">
  <div class="card-body p-4 p-md-5">
    <div class="text-danger fs-2 mb-3"><i class="bi bi-x-octagon"></i></div>
    <h1 class="h4 fw-bold">Reject {{ org.name }}?</h1>
    <p class="text-muted">
      The business page and owner account will remain inactive. No referral
      reward will be issued.
    </p>
    <form method="post" class="mt-4">
      {% csrf_token %}
      <label for="rejection_reason" class="form-label fw-semibold">Reason</label>
      <textarea id="rejection_reason" name="rejection_reason" class="form-control" rows="4"
                placeholder="Explain what must be corrected before reapplying."></textarea>
      <div class="d-flex gap-2 justify-content-end mt-4">
        <a href="{% url 'pending_approvals' %}" class="btn btn-outline-secondary">Cancel</a>
        <button class="btn btn-danger" type="submit"><i class="bi bi-x-lg me-1"></i>Reject Business</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
