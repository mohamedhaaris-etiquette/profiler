<div class="d-flex align-items-center flex-wrap gap-2 contact-inline">
  {% if org.phone %}<i class="bi bi-telephone"></i><a href="tel:{{ org.phone }}">{{ org.phone }}</a>{% endif %}
  {% if org.email %}<span class="sep">|</span><i class="bi bi-envelope"></i><a href="mailto:{{ org.email }}">{{ org.email }}</a>{% endif %}
  {% if org.city %}<span class="sep">|</span><i class="bi bi-geo-alt"></i>{{ org.city }}, {{ org.state }}{% endif %}
</div>
